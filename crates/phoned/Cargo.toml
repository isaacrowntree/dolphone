[package]
name = "phoned"
description = "Dolphone's phone daemon: the one owner of calls, texts and call audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
phone-api.workspace = true
phone-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
# KDE Connect: TLS with self-signed certificates, as its protocol has it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# PBKDF2 for the Messages PIN; already here through rustls.
ring = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
x509-parser = "0.16"
time = "0.3"
socket2 = "0.5"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
evdev = "0.13"

[dev-dependencies]
tempfile = "3"
