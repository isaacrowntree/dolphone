[package]
name = "phone-core"
description = "Models, storage and number rules shared by phoned, phonectl and the apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# No D-Bus and no UI here: everything in this crate is plain data and rules, so the
# apps, the daemon and the tests can all depend on it without pulling in either.
[dependencies]
libc = "0.2"
phonenumber = "0.3"
# SQLCipher in place of SQLite: the same file format when no key is given, and an
# encrypted one when it is (Store::open_keyed). It uses the system's libcrypto.
# Only phoned opens the store, so the panel apps build without it (no "db").
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"], optional = true }
serde.workspace = true
thiserror = "2"

[features]
default = ["db"]
db = ["dep:rusqlite"]

[dev-dependencies]
tempfile = "3"
