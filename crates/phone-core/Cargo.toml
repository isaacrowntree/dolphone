[package]
name = "phone-core"
description = "Models, storage and number rules shared by phoned, phonectl and the apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# No D-Bus and no UI here: everything in this crate is plain data and rules, so the
# apps, the daemon and the tests can all depend on it without pulling in either.
[dependencies]
libc = "0.2"
phonenumber = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde.workspace = true
thiserror = "2"

[dev-dependencies]
tempfile = "3"
