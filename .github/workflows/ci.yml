name: CI

on:
  push:
    branches: [main]
  pull_request:

# Everything builds on arm64, the panel's architecture: GitHub's arm runners are free
# for public repositories, and nothing has to be cross-compiled.
jobs:
  core:
    name: daemon, CLI, desktop app
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus dbus-user-session libfontconfig-dev libxkbcommon-dev fonts-dejavu-core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: End to end against the fake modem
        run: |
          cargo build --workspace
          # fake-mm takes ModemManager's name on the runner's real system bus.
          sudo install -m 0644 dist/dev/dolphone-fake-mm.conf /etc/dbus-1/system.d/
          sudo systemctl reload dbus || sudo kill -HUP "$(pidof dbus-daemon | cut -d' ' -f1)"
          scripts/e2e.sh

  apps:
    name: panel apps (${{ matrix.app }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        app: [dialer, messages, settings]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}
      - name: Tests, including the rendered screens
        working-directory: apps/${{ matrix.app }}
        run: DOLPHONE_RENDER=1 cargo test --locked
      - uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.app }}
          path: apps/${{ matrix.app }}/target/render/*.png
