name: Nightly against flipctl-slint main

# Dolphone tracks FlipCTL's main branch rather than pinning it. Every night the
# panel apps are rebuilt against whatever upstream has now, so a change there that
# breaks us shows up the next morning rather than at release time.
on:
  schedule:
    - cron: "17 19 * * *" # 05:17 in Sydney
  workflow_dispatch:

jobs:
  upstream:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        app: [dialer, messages, settings]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Move to flipctl-slint's newest commit
        working-directory: apps/${{ matrix.app }}
        run: |
          cargo update -p flipctl-app -p flipper-ui
          git diff --stat Cargo.lock || true
      - name: Build and test against it
        working-directory: apps/${{ matrix.app }}
        run: DOLPHONE_RENDER=1 cargo test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-screens-${{ matrix.app }}
          path: apps/${{ matrix.app }}/target/render/*.png
