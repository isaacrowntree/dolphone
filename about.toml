# Adapted from flipctl-slint (MIT). Configuration for `cargo about generate`, see scripts/gen-third-party-licenses.sh.
#
# We regenerate THIRD-PARTY-LICENSES.md from this so the attribution shipped with
# the binary always matches Cargo.lock. Our own code is MIT, but the binary links
# the Slint toolkit, for which we elect the GPL-3.0-only option of its tri-license
# (we hold no separate Slint agreement); that makes the combined binary
# GPL-3.0-only.

# Evaluate the dependency graph for the target the binary actually ships on, so
# we don't pull in licenses of platform crates (Windows/macOS/WASM) we never link.
targets = ["aarch64-unknown-linux-gnu"]

# Ignore dev-dependencies (the golden-image harness uses `png`, tests only):
# they are not part of the distributed binary.
ignore-dev-dependencies = true

# Licenses we are willing to comply under, in preference order. For a crate
# offering a choice (e.g. "MIT OR Apache-2.0"), the first match wins, so MIT is
# chosen wherever possible and extra texts are kept to a minimum. GPL-3.0-only is
# accepted solely to satisfy Slint's tri-license.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "NCSA",
    # The bundled sources of SQLCipher (sqlcipher-src, in phoned only): the
    # public-domain blessing of SQLite, and the WTFPL of libtomcrypt.
    "blessing",
    "WTFPL",
    "GPL-3.0-only",
]

# sqlcipher-src ships its upstreams' license files under sqlcipher/ rather than
# at the top, so cargo-about fell back to the bare BSD-3-Clause template, without
# the copyright line BSD-3 requires a binary to carry. Point it at the real files.
[sqlcipher-src.clarify]
license = "MIT AND BSD-3-Clause AND blessing AND WTFPL"

[[sqlcipher-src.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "413f82e0f4f8191a8624a7b7b2c9809466f7f3d930ad52a74ad29f2dd907881d"

[[sqlcipher-src.clarify.files]]
path = "sqlcipher/LICENSE-sqlcipher"
license = "BSD-3-Clause"
checksum = "2a2826f6acf46fa650730cf42cbb22a642be33a7ef119c9c4f4bf6daf3bef48e"
