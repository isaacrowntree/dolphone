[package]
name = "dolphone-desktop"
description = "Dolphone for desktop mode: the phone on an external display, with mouse and keyboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dolphone-desktop"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false }
phone-api.workspace = true
phone-bus.workspace = true
phone-core.workspace = true
tokio.workspace = true
zbus.workspace = true
# The desktop is a full Wayland or X11 session with a GPU; Slint's defaults (winit,
# the GL renderer) suit it. The software renderer and system fonts are there for
# the headless screenshot tests.
slint = { version = "1.17", features = ["renderer-software", "software-renderer-systemfonts"] }

[build-dependencies]
slint-build = "1.17"

[dev-dependencies]
png = "0.17"
