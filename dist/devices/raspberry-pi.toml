# Any Raspberry Pi with a USB modem or a modem HAT: a desk phone, an SMS gateway,
# a landline.
id = "raspberry-pi"
name = "Raspberry Pi with a modem"
status = "untested"
source = "The model string Linux reports on a Pi (\"Raspberry Pi 5 Model B Rev 1.0\" and the like)"
notes = "Texts and SIP calls work with any modem ModemManager supports. Mobile call audio works when the modem offers a USB sound card (UAC); a SIM7600 HAT sends serial PCM instead, which phoned does not bridge yet, and some HATs wire audio to their own jack. Use a USB headset or sound card for the speaker and microphone."
front_ends = ["desktop"]

[match]
dt_model = ["Raspberry Pi"]
priority = 40

[audio]
modem_match = ["Quectel", "EG25", "EC25", "SIMCOM", "SIM7600"]
