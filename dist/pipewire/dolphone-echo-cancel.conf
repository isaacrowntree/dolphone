# Dolphone: an echo canceller for calls on the built-in speaker.
#
# Installed to /usr/share/pipewire/pipewire.conf.d/. It makes a virtual sink and
# source (dolphone_ec_sink, dolphone_ec_source) backed by WebRTC's canceller. phoned
# routes a speaker call through them, so what the speaker plays is taken back out
# of what the microphone hears; headset and Bluetooth calls skip it (the headset's
# own mic is far from the speaker, and Bluetooth headsets cancel echo themselves).
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = false
            aec.args = {
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.voice_detection = true
                webrtc.gain_control = true
            }
            capture.props = {
                node.name = "dolphone_ec_capture"
                node.passive = true
            }
            source.props = {
                node.name = "dolphone_ec_source"
                node.description = "Dolphone call microphone (echo cancelled)"
            }
            sink.props = {
                node.name = "dolphone_ec_sink"
                node.description = "Dolphone call speaker (echo cancelled)"
            }
            playback.props = {
                node.name = "dolphone_ec_playback"
                node.passive = true
            }
        }
    }
]
