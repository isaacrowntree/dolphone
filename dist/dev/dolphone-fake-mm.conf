<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Development only: lets fake-mm run as an ordinary user on the system bus and lets
  that user drive it. Install to /etc/dbus-1/system.d/ on a machine with no real
  modem (scripts/dev-setup.sh does), never on a device with one: it allows any
  local user to own ModemManager's name.
-->
<busconfig>
  <policy context="default">
    <allow own="org.freedesktop.ModemManager1"/>
    <allow send_destination="org.freedesktop.ModemManager1"/>
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="io.github.isaacrowntree.Dolphone1.FakeModem"/>
  </policy>
</busconfig>
