# Dolphone: Bluetooth headsets for calls.
#
# Installed to /usr/share/wireplumber/wireplumber.conf.d/. It turns on the
# hands-free Audio Gateway roles (the phone's side of HFP/HSP) next to the usual
# A2DP ones, using PipeWire's own HFP implementation, and lets that implementation
# follow ModemManager's calls, so a headset rings, shows the caller where it can,
# and its button answers and hangs up. Call audio itself is routed by phoned (see
# crates/phoned/src/audio.rs), which bridges the headset to the modem.
monitor.bluez.properties = {
    bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hsp_hs hsp_ag hfp_hf hfp_ag ]
    bluez5.hfphsp-backend = "native"
    bluez5.hfphsp-backend-native-modem = "any"
    # mSBC and LC3-SWB give wideband (16 kHz and up) call audio where both ends can.
    bluez5.enable-msbc = true
    bluez5.enable-hw-volume = true
}
