# Dolphone: WirePlumber policy for calls.
#
# Installed to /usr/share/wireplumber/wireplumber.conf.d/.
#
# Bluetooth headsets: it turns on the hands-free Audio Gateway roles (the phone's
# side of HFP/HSP) next to the usual A2DP ones, using PipeWire's own HFP
# implementation, and lets that implementation follow ModemManager's calls, so a
# headset rings, shows the caller where it can, and its button answers and hangs
# up. Call audio itself is routed by phoned (see crates/phoned/src/audio.rs),
# which switches the headset to its headset-head-unit profile for the call (A2DP
# has no microphone), bridges it to the modem, and puts the old profile back after.
monitor.bluez.properties = {
    bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hsp_hs hsp_ag hfp_hf hfp_ag ]
    bluez5.hfphsp-backend = "native"
    bluez5.hfphsp-backend-native-modem = "any"
    # mSBC gives wideband (16 kHz) call audio where both ends support it, in place
    # of 8 kHz CVSD.
    bluez5.enable-msbc = true
    bluez5.enable-hw-volume = true
}

# The modem's own sound card (the RM520N-GL's UAC audio, and the like) is for
# phoned's call loopbacks only. Its priority is ALSA's default (around 1000, or
# more for a USB card), so it could otherwise become the default sink or source and
# take the ringer, music and the echo canceller with it. The lowest priority keeps
# it from being chosen while there is anything else; WirePlumber picks the
# highest (linking/find-best-target.lua). A default the owner chose by hand still
# wins.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_(input|output)\\..*Quectel.*" }
      { node.name = "~alsa_(input|output)\\..*SIMCOM.*" }
      { node.name = "~alsa_(input|output)\\..*SimTech.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1
      }
    }
  }
]
